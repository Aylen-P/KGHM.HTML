<!DOCTYPE html>
<html>
<head>
<title>Margarito</title>
<hr width="50%">
<style>
body{
    background: linear-gradient(135deg, #e9d5ff, #c4b5fd, #ddd6fe);
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 30px;
}

h1{
    color: #5b21b6;
    text-shadow: 2px 2px 5px #c4b5fd;
}

/* Línea decorativa */
hr{
    width: 50%;
    border: 2px solid #8b5cf6;
    border-radius: 10px;
}

/* Imagen con marco */
img{
    width: 300px;
    border: 5px solid #8b5cf6;
    border-radius: 20px;
    box-shadow: 0px 0px 20px #8b5cf6;
    transition: 0.3s;
}

/* Efecto al pasar el mouse */
img:hover{
    transform: scale(1.05);
}

p{
    background-color: white;
    width: 60%;
    margin: 20px auto;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0px 0px 10px #c4b5fd;
}

a{
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background-color: #7c3aed;
    color: white;
    text-decoration: none;
    border-radius: 15px;
    font-weight: bold;
}

a:hover{
    background-color: #5b21b6;
}
</style>

</head>
<body>

<h1>🪻 Margarito 🪻</h1>

<img src="margarito.jpg">

<p>
El apellido Margarito es un apellido de origen patronímico, lo que significa que se derivó directamente del nombre propio de un antepasado. Al igual que su raíz, proviene del latín margarita y del griego margarites, que significa “perla” o “persona de gran valor”.
</p>

</html>
